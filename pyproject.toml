[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-personal-assistant"
version = "0.1.0"
description = "A local-first personal assistant backend with Groq and Fish Audio adapters"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3",
  "httpx>=0.27,<1", "python-dotenv>=1,<2", "tzdata>=2024.2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
jarvis = "jarvis.__main__:main"

[tool.setuptools.package-data]
jarvis = ["prompts/*.txt", "migrations/*.sql", "static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
